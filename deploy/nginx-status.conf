# Inside the https server block for <host> (the one Let's Encrypt's
# certificate is for): a game server's counts, which the origin, the launcher
# and the game's own browser poll (status_url), and who is signed in, which
# the store reads for playtime. One pair per game; <status port> is its
# ENGINE2_STATUS_ADDR's.
location = /shim/<slug>/status.json { proxy_pass http://127.0.0.1:<status port>/status.json; }
location = /shim/<slug>/online.json { proxy_pass http://127.0.0.1:<status port>/online.json; }
