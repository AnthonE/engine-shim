[package]
name = "engine2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "s&box's native engine interface (igen_engine), reimplemented: for now, every slot a stub that records its first call"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
# What a client draws (render/): wgpu and what it brings. A server can
# build without it.
default = ["render"]
render = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:glam"]

[dependencies]
# Sign-In With Ethereum: recover a signer (secp256k1) from a keccak digest.
# The versions Gates' shards verify the same proofs with.
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
# The transport: QUIC through WebTransport, as Gates' shards speak it, so a
# browser can join one day. Git-pinned past the two-byte remote panic in
# 0.7.1 (#317), the rev Gates pins (its docs/NETCODE.md §2.2).
wtransport = { git = "https://github.com/BiagioFesta/wtransport", rev = "a11e6a8e7ff33c6eef522d308007da55d1df9f81", features = ["dangerous-configuration", "self-signed", "quinn"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# Elo Pros' origin: who holds a copy (/api/ticket). Blocking and never on a
# hot path; rustls, as Gates' shards ask it.
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# LZ4 (block and frame, the C library's formats): s&box compresses its
# network packets and its saved data with it.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode"] }
# Physics: bodies, shapes, joints and queries (MIT/Apache-2.0, pure Rust, so
# wasm too). Native s&box runs Box3D; this is ours in its place.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
# The collision rules managed sends as JSON.
serde_json = "1"
# What a client draws with: meshes' buffers as s&box compiles them
# (meshopt's codecs), and textures' blocks (BC1 to BC7) decoded.
meshopt = "0.7"
texture2ddecoder = "0.1.2"
# A texture's mips compressed with zstd (pure Rust, so wasm too).
ruzstd = "0.8"
# Drawing (feature "render"): wgpu (Vulkan, Metal, DX12, GL; WebGPU in a
# browser), and the math and byte casts it takes.
wgpu = { version = "25", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
glam = { version = "0.30", optional = true }
